name: Build ModDeck (Windows Executable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSBuild / Ninja
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install libopenmpt via vcpkg
      run: |
        vcpkg install libopenmpt:x64-windows

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/ModDeck/build -S ${{github.workspace}}/ModDeck -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: |
        cmake --build ${{github.workspace}}/ModDeck/build --config Release

    - name: Upload Windows Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModDeck-Windows-x64
        path: |
          ${{github.workspace}}/ModDeck/build/ModDeck_artefacts/Release/
          ${{github.workspace}}/ModDeck/build/ModDeck_artefacts/Release/Standalone/
